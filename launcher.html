<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Landscape Fullscreen PWA</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff5722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #000;
    }

    /* Welcome Overlay */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .landscape-btn {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    /* Custom Install App Button (Shuru mein chhupa rahega) */
    #install-btn {
      display: none;
      padding: 12px 25px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }

    #main-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* iOS / Portrait Fallback Warning */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      z-index: 10000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (orientation: portrait) {
      body.in-landscape-mode #rotate-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- iPhone/Portrait Fallback Message -->
  <div id="rotate-warning">
    <h2>📱 Please Rotate Your Phone</h2>
    <p style="margin-top: 10px; color: #aaa;">Behtar experience ke liye apna phone horizontal (landscape) ghumayein.</p>
  </div>

  <!-- Welcome Screen -->
  <div id="start-overlay">
    <h2>Welcome to My App</h2>
    <button class="landscape-btn" onclick="launchLandscapeFullscreen()">Start in Landscape</button>
    
    <!-- Custom Install Button -->
    <button id="install-btn">📲 Install App</button>
  </div>

  <!-- Aapka main content page -->
  <iframe id="main-frame"></iframe>

  <script>
    // 1. Service Worker Register karein
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker error:', err));
      });
    }

    // 2. Custom Install Button Logic
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Browser ke default mini-infobar ko rokein
      e.preventDefault();
      // Event ko save karein taaki button click par use kar sakein
      deferredPrompt = e;
      // Install button ko screen par dikhayein
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Install prompt dikhayein
        deferredPrompt.prompt();
        // User ka faisla (Accept/Dismiss) check karein
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User ne app install kar liya');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    // Jab app install ho jaye toh button chhupa dein
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // 3. Landscape Fullscreen Logic
    function launchLandscapeFullscreen() {
      const elem = document.documentElement;
      const overlay = document.getElementById('start-overlay');
      const frame = document.getElementById('main-frame');

      history.pushState({ page: "landscape" }, "", "#landscape");
      document.body.classList.add('in-landscape-mode');

      overlay.style.display = 'none';
      frame.src = "index.html"; 
      frame.style.display = 'block';

      requestFullAndLock(elem);
    }

    function requestFullAndLock(elem) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => {
          lockLandscape();
        }).catch((err) => {
          console.log("Fullscreen error:", err);
        });
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
        lockLandscape();
      }
    }

    function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch((err) => {
          console.log("Orientation lock supported nahi hai:", err);
        });
      }
    }

    function showWelcomeScreen() {
      const overlay = document.getElementById('start-overlay');
      const frame = document.getElementById('main-frame');

      document.body.classList.remove('in-landscape-mode');
      overlay.style.display = 'flex';
      frame.style.display = 'none';
      frame.src = "about:blank";

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("popstate", () => {
      showWelcomeScreen();
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        showWelcomeScreen();
      }
    });
  </script>

</body>
</html>
