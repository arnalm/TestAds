<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Door 90° Open</title>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
      touch-action: manipulation;
    }
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background-color: #000000; /* App ka background color */
}

/* Landscape mein left/right notch se content bachane ke liye */
.app-container {
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-top: env(safe-area-inset-top);
}


 /* Dark Transparent Background */
  .offline-bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  /* Simple White/Dark Card */
  .offline-box {
    background: #1e1e24;
    color: #ffffff;
    padding: 25px 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 300px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  }

  .offline-box h3 {
    margin: 12px 0 8px 0;
    font-size: 18px;
  }

  .offline-box p {
    margin: 0 0 20px 0;
    font-size: 14px;
    color: #cccccc;
  }

  /* Simple Clean Button */
  .simple-btn {
    background: #ff4757;
    color: #ffffff;
    border: none;
    padding: 10px 28px;
    font-size: 25px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }

  .simple-btn:active {
    background: #e0404e;
  }
   
</style>
</head>
<body>

  <!-- Simple Offline Popup -->
<div id="simple-offline-box" class="offline-bg">
  <div class="offline-box">
    <!-- Simple Wi-Fi Off Icon -->
    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>

    <h3>No Internet Connection</h3>
    <p>Please check your internet and try again.</p>
    
    <button onclick="checkInternet()" class="simple-btn">Retry</button>
  </div>
</div>



   
   <script>
  
// Page load hote hi turant body ko visible kar do
  document.addEventListener("DOMContentLoaded", () => {
    document.body.style.visibility = "visible";
  });

   
</script>

<script>
  const offlineBox = document.getElementById('simple-offline-box');

  // Internet band hone par dikhayein
  window.addEventListener('offline', () => {
    offlineBox.style.display = 'flex';
  });

  // Internet aane par apne aap hatayein
  window.addEventListener('online', () => {
    offlineBox.style.display = 'none';
  });

  // Shuru mein check karein
  if (!navigator.onLine) {
    offlineBox.style.display = 'flex';
  }

  // Retry button dabane par
  function checkInternet() {
    if (navigator.onLine) {
      offlineBox.style.display = 'none';
    }
  }
</script>


   
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaaaaaa);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight,0.1,100);
camera.position.set(4,3,6);
camera.lookAt(0,1,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// Light
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.MeshStandardMaterial({color:0x808080,
    wireframe :true
        
    })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// Door Frame
const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.1,2.2,1.2),
    new THREE.MeshStandardMaterial({color:0x444444,
        wireframe :true
    })
);
frame.position.set(0,1.1,0);
scene.add(frame);

// Door Pivot
const pivot = new THREE.Group();
pivot.position.set(0,0,0);
scene.add(pivot);

// Door
const door = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,0.08),
    new THREE.MeshStandardMaterial({color:0x8b4513,
        wireframe :true
    })
);
door.position.set(0.5,1,0);
pivot.add(door);

let target = 0;

// Click => Open/Close
window.addEventListener("click",()=>{
    target = target===0 ? Math.PI/2 : 0; // 90°
});

function animate(){
    requestAnimationFrame(animate);

    // Smooth animation
    pivot.rotation.y += (target - pivot.rotation.y)*0.08;

    // Clamp exactly 90°
    if(pivot.rotation.y > Math.PI/2)
        pivot.rotation.y = Math.PI/2;

    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
