
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>TIMEB & TEL GAME</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#1E293B">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:red;
    font-family: Arial, sans-serif;
}

/* START SCREEN */

#start-screen {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1E293B;
}

/* FULLSCREEN BUTTON */

#fullscreen-btn {
    padding: 18px 30px;
    background: orange;
    color: #111827;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#fullscreen-btn:active {
    transform: scale(0.95);
}

/* GAME SCREEN */

#game-container {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #aaaaaa;
}

#game-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<!-- START SCREEN -->

<div id="start-screen">

    <button id="fullscreen-btn">
        ⛶ ENTER FULLSCREEN
    </button>

</div>

<!-- GAME SCREEN -->

<div id="game-container"></div>


<script type="module">

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";


/* ELEMENTS */

const startScreen =
document.getElementById("start-screen");

const fullscreenBtn =
document.getElementById("fullscreen-btn");

const gameContainer =
document.getElementById("game-container");


/* GAME STATUS */

let gameStarted = false;
let backHandlerActive = false;


/* THREE JS SCENE */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xaaaaaa);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(4, 3, 6);

camera.lookAt(0, 1, 0);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

gameContainer.appendChild(renderer.domElement);


/* LIGHT */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(5, 10, 5);

scene.add(light);


/* FLOOR */

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),

    new THREE.MeshStandardMaterial({
        color: 0x808080,
        wireframe: true
    })
);

floor.rotation.x = -Math.PI / 2;

scene.add(floor);


/* DOOR FRAME */

const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 2.2, 1.2),

    new THREE.MeshStandardMaterial({
        color: 0x444444,
        wireframe: true
    })
);

frame.position.set(0, 1.1, 0);

scene.add(frame);


/* DOOR PIVOT */

const pivot = new THREE.Group();

pivot.position.set(0, 0, 0);

scene.add(pivot);


/* DOOR */

const door = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 0.08),

    new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        wireframe: true
    })
);

door.position.set(0.5, 1, 0);

pivot.add(door);


/* DOOR OPEN / CLOSE */

let target = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    function() {

        if (!gameStarted) return;

        target = target === 0
            ? Math.PI / 2
            : 0;

    }
);


/* ANIMATION */

function animate() {

    requestAnimationFrame(animate);

    if (!gameStarted) return;

    pivot.rotation.y +=
        (target - pivot.rotation.y) * 0.08;

    renderer.render(scene, camera);

}

animate();


/* RESIZE */

function resizeGame() {

    const width = gameContainer.clientWidth;

    const height = gameContainer.clientHeight;

    if (!width || !height) return;

    camera.aspect = width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

}

window.addEventListener("resize", resizeGame);


/* HISTORY SYSTEM */

function enableBackButton() {

    if (backHandlerActive) return;

    history.pushState(
        { gameScreen: true },
        "",
        window.location.href
    );

    backHandlerActive = true;

}


/* START GAME */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        if (gameStarted) return;

        // FULLSCREEN

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            }

        } catch(error) {

            console.log("Fullscreen error:", error);

        }


        // LANDSCAPE LOCK

        try {

            if (
                screen.orientation &&
                screen.orientation.lock
            ) {

                await screen.orientation.lock("landscape");

            }

        } catch(error) {

            console.log("Landscape error:", error);

        }


        // RESET DOOR

        target = 0;

        pivot.rotation.y = 0;


        // ENABLE BACK BUTTON

        enableBackButton();


        // HIDE START SCREEN

        startScreen.style.display = "none";


        // SHOW GAME

        gameContainer.style.display = "block";


        // START GAME

        gameStarted = true;

        resizeGame();

        renderer.render(scene, camera);

    }
);


/* EXIT GAME */

function exitGame() {

    if (!gameStarted) return;

    // STOP GAME

    gameStarted = false;


    // HIDE GAME

    gameContainer.style.display = "none";


    // RESET DOOR

    target = 0;

    pivot.rotation.y = 0;


    // SHOW ENTER FULLSCREEN BUTTON

    startScreen.style.display = "flex";


    // RESET BACK HANDLER

    backHandlerActive = false;

}


/* MOBILE BACK BUTTON */

window.addEventListener(
    "popstate",
    function() {

        if (!gameStarted) return;

        exitGame();

    }
);


/* FULLSCREEN CHANGE */

document.addEventListener(
    "fullscreenchange",
    function() {

        // FULLSCREEN EXITED

        if (!document.fullscreenElement && gameStarted) {

            exitGame();

        }

        // FULLSCREEN ACTIVE

        if (document.fullscreenElement && gameStarted) {

            resizeGame();

        }

    }
);

</script>

</body>
</html>
