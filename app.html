<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Door 90° Open</title>
<style>
    /* 🔑 Yahan '-' ki jagah '*' kiya gaya hai */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      outline: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      margin: 0;
      padding: 0;
      border: 0;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }
</style>
</head>
<body>

<script type="module">
// 🔑 Screen ko visible karne ke liye taaki canvas/three.js dikhai de
document.body.style.visibility = "visible";

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaaaaaa);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4, 3, 6);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Light
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
scene.add(light);

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.MeshStandardMaterial({
        color: 0x808080,
        wireframe: true
    })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Door Frame
const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 2.2, 1.2),
    new THREE.MeshStandardMaterial({
        color: 0x444444,
        wireframe: true
    })
);
frame.position.set(0, 1.1, 0);
scene.add(frame);

// Door Pivot
const pivot = new THREE.Group();
pivot.position.set(0, 0, 0);
scene.add(pivot);

// Door
const door = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 0.08),
    new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        wireframe: true
    })
);
door.position.set(0.5, 1, 0);
pivot.add(door);

let target = 0;

// Click => Open/Close
window.addEventListener("click", () => {
    target = target === 0 ? Math.PI / 2 : 0; // 90°
});

function animate() {
    requestAnimationFrame(animate);

    // Smooth animation
    pivot.rotation.y += (target - pivot.rotation.y) * 0.08;

    // Clamp exactly 90°
    if (pivot.rotation.y > Math.PI / 2)
        pivot.rotation.y = Math.PI / 2;

    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
