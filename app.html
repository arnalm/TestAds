
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>TIME & TEL</title>

<meta name="theme-color" content="#1E293B">
<meta name="description" content="Play TIME & TEL Game">

<link rel="manifest" href="./manifest.json">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #1E293B;
    color: white;
    text-align: center;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
}

.logo {
    font-size: 65px;
    margin: 35px 0 15px;
}

h1 {
    color: #fbbf24;
    font-size: 38px;
    margin-bottom: 15px;
}

.subtitle {
    color: #d1d5db;
    line-height: 1.6;
    margin-bottom: 25px;
}

button {
    display: block;
    width: 240px;
    max-width: 90%;
    padding: 15px;
    margin: 15px auto;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#start-btn {
    background: #fbbf24;
    color: #111827;
}

.secondary {
    background: #374151;
    color: white;
}

</style>
</head>

<body>

<div class="logo">🚚⛽</div>

<h1>TIME & TEL</h1>

<p class="subtitle">
Welcome to Time & Tel Game!<br>
Ready to Play?
</p>

<button id="start-btn">
▶ Play Now
</button>

<button class="secondary" id="share-btn">
📤 Share App
</button>

<script>

// PLAY GAME
document.getElementById("start-btn").addEventListener("click", function() {

    window.location.href = "./app.html";

});

// SHARE APP
document.getElementById("share-btn").addEventListener("click", async function() {

    const shareData = {
        title: "TIME & TEL Game",
        text: "🚚⛽ Play TIME & TEL Game!",
        url: window.location.href
    };

    try {

        if (navigator.share) {
            await navigator.share(shareData);
        } else {
            await navigator.clipboard.writeText(
                shareData.text + " " + shareData.url
            );
            alert("Game link copied!");
        }

    } catch(error) {
        console.log(error);
    }

});

// SERVICE WORKER
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js")
        .catch(error => console.log(error));
    });
}

</script>

</body>
</html>
