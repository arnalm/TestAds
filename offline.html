<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Internet</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      margin-top: 15px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>इंटरनेट कनेक्शन बंद है ⚠️</h2>
  <p>यह ऐप केवल Online चलता है। कृपया इंटरनेट चालू करके पुनः प्रयास करें।</p>
  <button onclick="window.location.reload()">पुनः प्रयास करें (Retry)</button>
</body>
</html>
