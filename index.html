<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Full-Screen और Mobile App Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>My Landscape PWA</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }
    #installBtn {
      display: none;
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      background-color: #00c853;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    /* पोर्ट्रेट मोड में स्क्रीन घुमाने का संदेश (iOS/ब्राउज़र के लिए) */
    #rotateMessage {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      padding: 20px;
    }
    @media screen and (orientation: portrait) {
      #rotateMessage { display: flex; }
    }
  </style>
</head>
<body>

  <!-- अगर फ़ोन सीधा (Portrait) हो तो यह दिखेगा -->
  <div id="rotateMessage">
    कृपया इस ऐप को चलाने के लिए अपना फ़ोन आड़ा (Landscape) करें 🔄
  </div>

  <!-- आपके ऐप की मुख्य स्क्रीन -->
  <div id="app">
    <h1>स्वागत है! यह आपका Landscape PWA है</h1>
    <p>यह ऐप पूरी तरह Online और Full-Screen मोड में काम करता है।</p>
    <button id="installBtn">📲 App Install करें</button>
  </div>

  <script>
    // 1. Service Worker रजिस्टर करें
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch((err) => console.error('SW Error:', err));
      });
    }

    // 2. Custom Install Button लॉजिक
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // 3. ऐप इंस्टॉल होने के बाद बटन छिपा दें
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
