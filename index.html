<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>TIME & TEL</title>

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TIME & TEL">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
    
    }

body {
      width: 100%;
      height: 100vh;
      background: red;
      text-align: center;
    }

    

    .logo {
      font-size: 65px;
      margin-bottom: 12px;
    }

    h1 {
      color: #fbbf24;
      font-size: 38px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      width: 240px;
      max-width: 90%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    #start-btn {
      background: #fbbf24;
      color: #111827;
    }

    #install-btn {
      display: none; /* Shuru mein hidden taaki installed app mein flash na ho */
      background: #16a34a;
      color: white;
      text-align: center;
    }

    .secondary {
      background: #374151;
      color: white;
      border: 1px solid #6b7280;
    }

    
  </style>
</head>

<body>



    <div class="logo">🚚⛽</div>

    <h1>TIME & TEL</h1>

    <p class="subtitle">
      Welcome to Time & Tel Game!<br>
      Ready to Play?
    </p>

    <a href="./app.html"
       style="text-decoration:none; width:240px; max-width:90%;">

      <button id="start-btn" type="button">
        ▶ Play Now
      </button>

    </a>

    <button id="install-btn" type="button">
      📲 Install App
    </button>

    <button id="share-btn" class="secondary" type="button">
      📤 Share App
    </button>

  

  <script type="text/javascript" charset="utf-8">
    //____1. Service Worker Registration____
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => {
            console.log("Service Worker registered:", reg.scope);
          })
          .catch((err) => {
            console.error("Service Worker registration failed:", err);
          });
      });
    }

    //____2. App Install Button Code (Hide if already installed)____
    let deferredPrompt = null;
    const installBtn = document.getElementById("install-btn");

    function isRunningAsInstalledPWA() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.navigator.standalone === true ||
        document.referrer.includes("android-app://")
      );
    }

    async function hasRelatedInstalledApp() {
      if ("getInstalledRelatedApps" in navigator) {
        try {
          const relatedApps = await navigator.getInstalledRelatedApps();
          return Array.isArray(relatedApps) && relatedApps.length > 0;
        } catch (err) {
          return false;
        }
      }
      return false;
    }

    async function updateInstallButtonVisibility() {
      if (isRunningAsInstalledPWA() || await hasRelatedInstalledApp()) {
        installBtn.style.display = "none";
        return;
      }

      // Sirf tab dikhayein jab install prompt available ho ya browser guidance dena ho
      if (deferredPrompt) {
        installBtn.style.display = "block";
      } else {
        installBtn.style.display = "none";
      }
    }

    updateInstallButtonVisibility();

    // Agar user display mode badalta hai (jaise browser se installed window mein shift)
    window.matchMedia("(display-mode: standalone)").addEventListener("change", updateInstallButtonVisibility);

    window.addEventListener("beforeinstallprompt", async (event) => {
      event.preventDefault();
      deferredPrompt = event;
      await updateInstallButtonVisibility();
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        installBtn.style.display = "none";
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      deferredPrompt = null;
    });

    //____3. Share Button Code____
    const shareBtn = document.getElementById("share-btn");

    shareBtn.addEventListener("click", async () => {
      const shareData = {
        title: "TIME & TEL Game",
        text: "🚚⛽ Play TIME & TEL Game! Try this amazing game!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          console.log("Sharing cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(
            shareData.text + " " + shareData.url
          );
          alert("Game link copied! Share it with your friends.");
        } catch (error) {
          prompt("Copy your game link:", shareData.url);
        }
      }
    });
  </script>

</body>
</html>
