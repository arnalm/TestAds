
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>My Fullscreen PWA</title>

  <meta name="theme-color" content="#ff5722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My App">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  border: none;
  outline: none;
}

#main-frame {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
}

    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      padding: 20px;
    }

    button {
      width: 240px;
      max-width: 90%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #start-btn {
      background: #ff5722;
    }

    #install-btn {
      background: #2e7d32;
    }



    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    body.in-landscape-mode #rotate-warning {
      display: none;
    }

    @media (orientation: portrait) {
      body.in-landscape-mode #rotate-warning {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <div id="rotate-warning">
    <h2>📱 Rotate Your Phone</h2>
    <p style="margin-top:10px;color:#aaa">
      Please rotate your phone horizontally.
    </p>
  </div>

  <div id="start-overlay">
    <h2>Welcome to My App</h2>

    <button id="start-btn" onclick="launchApp()">
      Start in Landscape
    </button>

    <button id="install-btn" onclick="installPWA()">
      📲 Install App
    </button>
  </div>

  <iframe
    id="main-frame"
    title="Main App"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    let deferredPrompt = null;
    let launched = false;

    const installBtn = document.getElementById("install-btn");
    const overlay = document.getElementById("start-overlay");
    const frame = document.getElementById("main-frame");

    // Check installed app
    function isInstalled() {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.matchMedia("(display-mode: fullscreen)").matches ||
             window.navigator.standalone === true;
    }

    if (isInstalled()) {
      installBtn.style.display = "none";
    }

    // PWA install event
    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "block";
    });

    // Install PWA
    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();

        const result = await deferredPrompt.userChoice;

        if (result.outcome === "accepted") {
          installBtn.style.display = "none";
        }

        deferredPrompt = null;
      } else {
        alert(
          "Android Chrome:\n" +
          "3 dots > Install app\n\n" +
          "iPhone Safari:\n" +
          "Share > Add to Home Screen\n\n" +
          "Make sure website is running on HTTPS."
        );
      }
    }

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      deferredPrompt = null;
    });

    // Launch app in fullscreen
    async function launchApp() {
      launched = true;

      document.body.classList.add("in-landscape-mode");

      overlay.style.display = "none";

      frame.src = "./app.html";
      frame.style.display = "block";

      // Request fullscreen from user click
      try {
        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen unavailable:", error);
      }

      // Lock landscape
      try {
        if (screen.orientation &&
            screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("Orientation lock unavailable:", error);
      }
    }

    // Back to welcome screen
    function showWelcomeScreen() {
      launched = false;

      document.body.classList.remove("in-landscape-mode");

      overlay.style.display = "flex";
      frame.style.display = "none";
      frame.src = "about:blank";

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("popstate", showWelcomeScreen);

    document.addEventListener("fullscreenchange", () => {
      if (launched && !document.fullscreenElement) {
        showWelcomeScreen();
      }
    });

    // Register service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
          console.log("Service Worker Registered!");
        } catch (error) {
          console.error("Service Worker Error:", error);
        }
      });
    }
  </script>

</body>
</html>
