
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>My PWA Website</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  min-height: 100vh;
}

.main {
  text-align: center;
  padding: 60px 20px;
}

.main h1 {
  color: #2563eb;
  margin-bottom: 15px;
}

#installPopup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 20px;
}

.popup {
  background: white;
  width: 100%;
  max-width: 360px;
  border-radius: 22px;
  padding: 30px 25px;
  text-align: center;
  position: relative;
  animation: popupShow 0.4s ease;
}

@keyframes popupShow {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.appIcon {
  width: 85px;
  height: 85px;
  margin: 0 auto 18px;
  background: #2563eb;
  border-radius: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 45px;
}

.popup h2 {
  font-size: 23px;
  color: #222;
  margin-bottom: 12px;
}

.popup p {
  font-size: 14px;
  line-height: 1.6;
  color: #666;
  margin-bottom: 22px;
}

.installBtn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.installBtn:active {
  transform: scale(0.97);
}

.closeBtn {
  position: absolute;
  right: 13px;
  top: 13px;
  height: 30px;
  width: 30px;
  border: none;
  border-radius: 50%;
  background: #eee;
  font-size: 20px;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  font-size: 13px;
  color: #2563eb;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="main">
  <h1>Welcome To My Website</h1>
  <p>Your website content goes here.</p>
</div>

<!-- INSTALL POPUP -->

<div id="installPopup">

  <div class="popup">

    <button class="closeBtn" id="closeBtn">×</button>

    <div class="appIcon">📱</div>

    <h2>Install Our App</h2>

    <p>
      Install our website on your mobile
      and enjoy a better app experience.
    </p>

    <button class="installBtn" id="installBtn">
      📲 Install Now
    </button>

    <div id="status"></div>

  </div>

</div>

<script>

// CREATE MANIFEST IN MEMORY
// Note: This single-file demo uses a Blob manifest.
// A production PWA needs a separately hosted manifest.json.

const manifestData = {
  name: "My Website",
  short_name: "MyApp",
  start_url: location.href,
  display: "standalone",
  background_color: "#ffffff",
  theme_color: "#2563eb"
};

const manifestBlob = new Blob(
  [JSON.stringify(manifestData)],
  { type: "application/manifest+json" }
);

const manifestURL = URL.createObjectURL(manifestBlob);

const manifestLink = document.createElement("link");
manifestLink.rel = "manifest";
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);


// ELEMENTS
const popup = document.getElementById("installPopup");
const installBtn = document.getElementById("installBtn");
const closeBtn = document.getElementById("closeBtn");
const status = document.getElementById("status");

let deferredPrompt = null;


// CHECK IF ALREADY INSTALLED
function isAppInstalled() {
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.navigator.standalone === true;
}


// AUTOMATIC POPUP AFTER 3 SECONDS
window.addEventListener("load", () => {

  if (!isAppInstalled() &&
      !sessionStorage.getItem("popupClosed")) {

    setTimeout(() => {
      popup.style.display = "flex";
    }, 3000);

  }

});


// LISTEN FOR BROWSER INSTALL EVENT
window.addEventListener("beforeinstallprompt", (event) => {

  event.preventDefault();

  deferredPrompt = event;

  installBtn.style.display = "block";

});


// INSTALL BUTTON
installBtn.addEventListener("click", async () => {

  if (deferredPrompt) {

    deferredPrompt.prompt();

    const choice = await deferredPrompt.userChoice;

    if (choice.outcome === "accepted") {

      status.innerText = "Installation accepted!";

      popup.style.display = "none";

    } else {

      status.innerText = "Installation cancelled.";

    }

    deferredPrompt = null;

  } else {

    status.innerText =
      "Browser install prompt is not available. Chrome menu se Install App ya Add to Home Screen chunein.";

  }

});


// CLOSE POPUP
closeBtn.addEventListener("click", () => {

  popup.style.display = "none";

  sessionStorage.setItem("popupClosed", "yes");

});


// APP INSTALLED EVENT
window.addEventListener("appinstalled", () => {

  popup.style.display = "none";

  status.innerText = "App successfully installed!";

});

</script>

</body>
</html>
