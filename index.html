
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>My Website</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.main {
  padding: 60px 20px;
  text-align: center;
}

.main h1 {
  color: #2563eb;
  margin-bottom: 15px;
}

#installPopup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 20px;
}

.popup {
  background: white;
  width: 100%;
  max-width: 350px;
  padding: 30px 25px;
  border-radius: 22px;
  text-align: center;
  position: relative;
  animation: show .4s ease;
}

@keyframes show {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.app-icon {
  width: 80px;
  height: 80px;
  background: #2563eb;
  border-radius: 20px;
  margin: auto auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
}

.popup h2 {
  color: #222;
  margin-bottom: 12px;
}

.popup p {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.install-btn {
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.close-btn {
  position: absolute;
  top: 12px;
  right: 15px;
  border: none;
  background: #eee;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  font-size: 20px;
  cursor: pointer;
}

#message {
  margin-top: 15px;
  font-size: 13px;
  color: #2563eb;
}

</style>
</head>

<body>

<div class="main">
  <h1>Welcome To My Website</h1>
  <p>Enjoy our website experience!</p>
</div>

<!-- INSTALL POPUP -->

<div id="installPopup">

  <div class="popup">

    <button class="close-btn" id="closePopup">×</button>

    <div class="app-icon">📱</div>

    <h2>Install Our App</h2>

    <p>
      Hamari website ko apne mobile mein
      install karein aur app ki tarah use karein.
    </p>

    <button class="install-btn" id="installBtn">
      📲 Install Now
    </button>

    <div id="message"></div>

  </div>

</div>

<script>

// CREATE PWA MANIFEST
const manifest = {
  name: "My Website",
  short_name: "MyApp",
  start_url: "./",
  scope: "./",
  display: "standalone",
  background_color: "#ffffff",
  theme_color: "#2563eb",
  icons: [
    {
      src: "./icon-192.png",
      sizes: "192x192",
      type: "image/png"
    },
    {
      src: "./icon-512.png",
      sizes: "512x512",
      type: "image/png"
    }
  ]
};

const manifestBlob = new Blob(
  [JSON.stringify(manifest)],
  {type: "application/manifest+json"}
);

const manifestURL = URL.createObjectURL(manifestBlob);

const link = document.createElement("link");
link.rel = "manifest";
link.href = manifestURL;
document.head.appendChild(link);


// SERVICE WORKER REGISTRATION
// Production mein service-worker.js alag file honi chahiye.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.log("SW Error:", error));
  });
}


// INSTALL POPUP SYSTEM

let deferredPrompt = null;

const popup = document.getElementById("installPopup");
const installBtn = document.getElementById("installBtn");
const closeBtn = document.getElementById("closePopup");
const message = document.getElementById("message");

let isInstalled = false;

if (window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true) {
  isInstalled = true;
}


// Browser install event
window.addEventListener("beforeinstallprompt", (event) => {

  event.preventDefault();

  deferredPrompt = event;

  installBtn.style.display = "block";

});


// Show popup after 3 seconds
window.addEventListener("load", () => {

  if (!isInstalled &&
      !sessionStorage.getItem("installPopupClosed")) {

    setTimeout(() => {
      popup.style.display = "flex";
    }, 3000);

  }

});


// Install button
installBtn.addEventListener("click", async () => {

  if (deferredPrompt) {

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {

      message.innerText = "Installation accepted!";

      popup.style.display = "none";

    } else {

      message.innerText = "Installation cancelled.";

    }

    deferredPrompt = null;

  } else {

    message.innerText =
      "Install option abhi available nahi hai. Chrome menu se Add to Home Screen chunein.";

  }

});


// Close popup
closeBtn.addEventListener("click", () => {

  popup.style.display = "none";

  sessionStorage.setItem("installPopupClosed", "yes");

});


// Successful installation
window.addEventListener("appinstalled", () => {

  isInstalled = true;

  popup.style.display = "none";

  message.innerText = "App Successfully Installed!";

});

</script>

</body>
</html>
