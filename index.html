
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">

<title>Fullscreen PWA</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    position: fixed;
    inset: 0;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 700px;
    padding: 20px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    gap: 18px;
}

.logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

h1 {
    font-size: clamp(22px, 4vw, 38px);
}

.subtitle {
    color: #aaa;
    font-size: 15px;
}

/* BUTTON CONTAINER */

.buttons {
    width: 100%;
    max-width: 350px;

    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* BUTTON STYLE */

.btn {
    width: 100%;
    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 14px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
    touch-action: manipulation;
}

/* INSTALL BUTTON */

.install-btn {
    background: #ffffff;
    color: #000000;
}

/* FULLSCREEN BUTTON */

.fullscreen-btn {
    background: #222222;
    color: #ffffff;
    border: 1px solid #555;
}

/* BUTTON PRESS */

.btn:active {
    transform: scale(0.97);
}

/* STATUS */

#status {
    font-size: 13px;
    color: #888;
    min-height: 20px;
}

/* ROTATE MESSAGE */

#rotateMessage {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 99999;

    background: #000;
    color: white;

    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;
}

@media (orientation: portrait) {
    #rotateMessage {
        display: flex;
    }
}

/* LANDSCAPE SMALL SCREEN */

@media (orientation: landscape) and (max-height: 450px) {

    .container {
        gap: 8px;
        padding: 8px;
    }

    .logo {
        width: 50px;
        height: 50px;
    }

    h1 {
        font-size: 22px;
    }

    .subtitle {
        font-size: 12px;
    }

    .buttons {
        flex-direction: row;
        max-width: 500px;
        gap: 10px;
    }

    .btn {
        min-height: 48px;
        font-size: 14px;
    }
}

</style>
</head>

<body>

<div id="app">

    <div class="container">

        <img
            src="./icons/icon-192.png"
            class="logo"
            alt="App Icon"
        >

        <h1>Fullscreen App</h1>

        <div class="subtitle">
            Landscape PWA
        </div>

        <div class="buttons">

            <button
                id="installBtn"
                class="btn install-btn"
                style="display:none"
            >
                📲 Install App
            </button>

            <button
                id="fullscreenBtn"
                class="btn fullscreen-btn"
            >
                ⛶ Full Screen
            </button>

        </div>

        <div id="status">
            Ready
        </div>

    </div>

</div>

<div id="rotateMessage">
    <div>
        <h2>Please Rotate Your Device</h2>
        <p>Landscape mode me phone use karein.</p>
    </div>
</div>

<script>

// INSTALL APP

let deferredPrompt;

const installBtn = document.getElementById("installBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const status = document.getElementById("status");

window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault();

    deferredPrompt = e;

    installBtn.style.display = "flex";

    status.textContent = "App install karne ke liye click karein";

});

// INSTALL BUTTON CLICK

installBtn.addEventListener("click", async () => {

    if (!deferredPrompt) {

        status.textContent =
        "Chrome menu ⋮ se Install App select karein";

        return;
    }

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {
        status.textContent = "Installing App...";
    } else {
        status.textContent = "Installation cancelled";
    }

    deferredPrompt = null;

    installBtn.style.display = "none";

});

// INSTALLED EVENT

window.addEventListener("appinstalled", () => {

    installBtn.style.display = "none";

    status.textContent = "App Installed Successfully";

});

// FULLSCREEN

fullscreenBtn.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

            if (screen.orientation &&
                screen.orientation.lock) {

                await screen.orientation.lock("landscape");
            }

            fullscreenBtn.textContent = "⛶ Exit Full Screen";

            status.textContent = "Fullscreen Enabled";

        } else {

            await document.exitFullscreen();

            fullscreenBtn.textContent = "⛶ Full Screen";

            status.textContent = "Fullscreen Disabled";
        }

    } catch (error) {

        status.textContent =
        "Fullscreen browser support nahi karta";

    }

});

// FULLSCREEN CHANGE

document.addEventListener("fullscreenchange", () => {

    if (!document.fullscreenElement) {
        fullscreenBtn.textContent = "⛶ Full Screen";
    }

});

// PWA DETECT

const isPWA =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches ||
    window.navigator.standalone === true;

if (isPWA) {

    installBtn.style.display = "none";

    status.textContent = "Installed App Mode";

}

// SERVICE WORKER

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js")
        .then(() => {
            console.log("Service Worker Ready");
        })
        .catch((err) => {
            console.error(err);
        });

    });

}

</script>

</body>
</html>
