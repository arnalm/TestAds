<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>My Landscape PWA</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }
    #installBtn {
      display: inline-block; /* बटन हमेशा दिखेगा */
      margin-top: 25px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      background-color: #00c853;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
    }
    #installBtn:active { transform: scale(0.96); }
    
    #rotateMessage {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      padding: 20px;
    }
    @media screen and (orientation: portrait) {
      #rotateMessage { display: flex; }
    }
  </style>
</head>
<body>

  <div id="rotateMessage">
    कृपया अपना फ़ोन आड़ा (Landscape) करें 🔄
  </div>

  <div id="app">
    <h1>मेरा Landscape ऐप</h1>
    <p>फुल-स्क्रीन में चलाने के लिए नीचे दिए बटन पर क्लिक करें:</p>
    <button id="installBtn">📲 Install App</button>
  </div>

  <script>
    // 1. Service Worker रजिस्टर करें
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    // अगर ऐप पहले से इंस्टॉल मोड (Fullscreen/Standalone) में खुला है, तो बटन छिपा दें
    if (window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true) {
      installBtn.style.display = 'none';
    }

    // ब्राउज़र का इंस्टॉल इवेंट कैप्चर करें
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // बटन क्लिक करते ही इंस्टॉल पॉप-अप खोलें
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Android / Chrome / Edge पर सीधा इंस्टॉल पॉप-अप खुलेगा
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        // iPhone (Safari) या जब ब्राउज़र पॉप-अप ब्लॉक करे
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isIOS) {
          alert('iPhone पर इंस्टॉल करने के लिए:\n1. नीचे Share आइकन (⬆️) पर टैप करें\n2. "Add to Home Screen" चुनें');
        } else {
          alert('इंस्टॉल करने के लिए ब्राउज़र के ऊपर दाईं ओर 3 डॉट्स (⋮) पर क्लिक करें और "Install app" या "Add to Home screen" चुनें।');
        }
      }
    });

    // इंस्टॉल पूरा होते ही बटन हटा दें
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
