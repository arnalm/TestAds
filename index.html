
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>My Fullscreen App</title>

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My App">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      border: none;
      outline: none;
      font-family: Arial, sans-serif;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
    }

    button {
      width: 240px;
      max-width: 90%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #start-btn {
      background: #ff5722;
    }

    #install-btn {
      background: #2e7d32;
    }

    #main-frame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      outline: none;
      background: #000;
    }

    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    @media (orientation: portrait) {
      body.in-landscape-mode #rotate-warning {
        display: flex;
      }
    }

  </style>
</head>

<body>

  <div id="rotate-warning">
    <h2>📱 Rotate Your Phone</h2>
    <p style="margin-top:10px;color:#aaa">
      Please rotate your phone horizontally.
    </p>
  </div>

  <div id="start-overlay">

    <h2>Welcome to My App</h2>

    <button id="start-btn" onclick="launchApp()">
      Start App
    </button>

    <button id="install-btn" onclick="installPWA()">
      📲 Install App
    </button>

  </div>

  <iframe
    id="main-frame"
    title="My App"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>

    let deferredPrompt = null;

    const overlay = document.getElementById("start-overlay");
    const frame = document.getElementById("main-frame");
    const installBtn = document.getElementById("install-btn");

    // Check installed PWA
    function isInstalledPWA() {

      return (
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );

    }

    // Open actual app
    async function openApp() {

      document.body.classList.add("in-landscape-mode");

      overlay.style.display = "none";

      frame.src = "./app.html";
      frame.style.display = "block";

      // Lock landscape where supported
      try {

        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }

      } catch (error) {

        console.log("Landscape lock unavailable");

      }

    }

    // Launch from welcome screen
    async function launchApp() {

      try {

        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {

          await document.documentElement.requestFullscreen();

        }

      } catch (error) {

        console.log("Browser fullscreen unavailable");

      }

      await openApp();

    }

    // Automatically open app when installed PWA launches
    window.addEventListener("load", () => {

      if (isInstalledPWA()) {

        installBtn.style.display = "none";

        openApp();

      }

    });

    // Installation prompt
    window.addEventListener("beforeinstallprompt", (event) => {

      event.preventDefault();

      deferredPrompt = event;

      installBtn.style.display = "block";

    });

    async function installPWA() {

      if (deferredPrompt) {

        deferredPrompt.prompt();

        const result = await deferredPrompt.userChoice;

        if (result.outcome === "accepted") {

          installBtn.style.display = "none";

        }

        deferredPrompt = null;

      } else {

        alert(
          "Android Chrome: 3 dots > Install app\n\n" +
          "iPhone Safari: Share > Add to Home Screen"
        );

      }

    }

    window.addEventListener("appinstalled", () => {

      installBtn.style.display = "none";

      deferredPrompt = null;

    });

    // Back button
    window.addEventListener("popstate", () => {

      document.body.classList.remove("in-landscape-mode");

      overlay.style.display = "flex";

      frame.style.display = "none";

      frame.src = "about:blank";

    });

    // Service Worker
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", async () => {

        try {

          await navigator.serviceWorker.register("./sw.js");

          console.log("Service Worker Registered");

        } catch (error) {

          console.error("Service Worker Error:", error);

        }

      });

    }

  </script>

</body>
</html>
