<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#000000">
    <meta name="description" content="Fullscreen Landscape PWA">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

<link rel="apple-touch-icon" href="./icons/icon-192.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Fullscreen App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            font-family: Arial, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000000;
            overflow: hidden;
            border: none;
            outline: none;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(24px, 5vw, 50px);
            margin-bottom: 15px;
        }

        p {
            font-size: clamp(14px, 2vw, 20px);
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 28px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.96);
        }

        #installBtn {
            display: none;
        }

        #status {
            margin-top: 20px;
            font-size: 13px;
            color: #888888;
        }

        /* Portrait me landscape karne ka message */
        #rotateMessage {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        @media (orientation: portrait) {
            #rotateMessage {
                display: flex;
            }
        }

        /* Top border/header nahi */
        header, nav, footer {
            border: none !important;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="main">

            <h1>My Fullscreen App</h1>

            <p>Landscape Fullscreen PWA</p>

            <button id="installBtn">
                Install App
            </button>

            <button id="fullscreenBtn">
                Fullscreen
            </button>

            <div id="status">
                App Ready
            </div>

        </div>
    </div>

    <div id="rotateMessage">
        <div>
            <h2>Please Rotate Your Phone</h2>
            <p>App landscape mode me use karein.</p>
        </div>
    </div>

    <script>
        // PWA INSTALL
        let deferredPrompt = null;

        const installBtn = document.getElementById("installBtn");
        const status = document.getElementById("status");

        window.addEventListener("beforeinstallprompt", (event) => {
            event.preventDefault();
            deferredPrompt = event;

            installBtn.style.display = "block";
            status.textContent = "App install karne ke liye button dabayein";
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) {
                status.textContent = "Browser menu se Add to Home Screen karein";
                return;
            }

            deferredPrompt.prompt();

            const result = await deferredPrompt.userChoice;

            if (result.outcome === "accepted") {
                status.textContent = "App install ho raha hai...";
            } else {
                status.textContent = "Installation cancel ho gaya";
            }

            deferredPrompt = null;
            installBtn.style.display = "none";
        });

        // INSTALL SUCCESS
        window.addEventListener("appinstalled", () => {
            status.textContent = "App successfully install ho gaya!";
            installBtn.style.display = "none";
        });

        // FULLSCREEN BUTTON
        document.getElementById("fullscreenBtn")
            .addEventListener("click", async () => {
                try {
                    if (!document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();

                        if (screen.orientation &&
                            screen.orientation.lock) {
                            await screen.orientation.lock("landscape");
                        }

                        status.textContent = "Fullscreen enabled";
                    } else {
                        await document.exitFullscreen();
                    }
                } catch (error) {
                    status.textContent =
                        "Fullscreen browser se supported nahi hai";
                }
            });

        // LANDSCAPE ORIENTATION
        async function lockLandscape() {
            try {
                if (screen.orientation &&
                    screen.orientation.lock) {
                    await screen.orientation.lock("landscape");
                }
            } catch (error) {
                // Device orientation lock unsupported
            }
        }

        // PWA DETECTION
        const isInstalled =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches ||
            window.navigator.standalone === true;

        if (isInstalled) {
            installBtn.style.display = "none";
            status.textContent = "Installed App Mode";
            lockLandscape();
        }

        // SERVICE WORKER
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(() => {
                        console.log("Service Worker Registered");
                    })
                    .catch((error) => {
                        console.log("Service Worker Error:", error);
                    });
            });
        }
    </script>

</body>
</html>
