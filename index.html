<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- स्क्रीन के कोनों और नॉच को पूरी तरह कवर करने के लिए -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>My Landscape PWA</title>
  
  <!-- मेनिफेस्ट फ़ाइल को जोड़ें -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Android और iOS पर टॉप बार को गायब/मैच करने के लिए -->
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* डिफ़ॉल्ट मार्जिन और टॉप बॉर्डर हटाने की सेटिंग */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100dvh; /* लैंडस्केप में पूरी ऊंचाई के लिए */
      overflow: hidden;
      background-color: #000000; /* अपने ऐप का बैकग्राउंड रंग रखें */
      color: #ffffff;
      font-family: sans-serif;
      
      /* लैंडस्केप में साइड के कैमरा नॉच से कंटेंट बचाने के लिए */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>मेरा फुल-स्क्रीन PWA ऐप</h1>
    <p>यहाँ अपना कोड या कंटेंट लिखें</p>
  </div>

  <!-- Service Worker को रजिस्टर करने का कोड -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered!'))
          .catch(err => console.log('Service Worker Error:', err));
      });
    }
  </script>

</body>
</html>
