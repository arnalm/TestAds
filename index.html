
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>TIME & TEL</title>

  <meta name="theme-color" content="#1E293B">
  <meta name="description" content="Play TIME & TEL Game online and offline.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TIME & TEL">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #1E293B;
      text-align: center;
      padding: 20px 10px 40px;
    }

    .logo {
      font-size: 55px;
      margin-top: 15px;
      margin-bottom: 12px;
    }

    h1 {
      color: #fbbf24;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      display: block;
      width: 240px;
      max-width: 90%;
      padding: 14px;
      margin: 12px auto 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    #start-btn {
      background: #fbbf24;
      color: #111827;
    }

    #install-btn {
      display: none;
      background: #16a34a;
      color: white;
    }

    .secondary {
      background: #374151;
      color: white;
      border: 1px solid #6b7280;
    }
  </style>
</head>

<body>

  <div class="logo">🚚⛽</div>

  <h1>TIME & TEL</h1>

  <p class="subtitle">
    Welcome to Time & Tel Game!<br>
    Ready to Play?
  </p>

  <button id="start-btn" type="button">
  ▶ Play Now
</button>

  <button id="share-btn" class="secondary" type="button">
    📤 Share App
  </button>

  <button id="install-btn" type="button">
    📲 Install App
  </button>

<script>
document.getElementById("start-btn").addEventListener("click", async function() {

    window.location.href = "./app.html";

});
</script>


  
  <script>
    // SERVICE WORKER REGISTRATION

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration =
            await navigator.serviceWorker.register("./sw.js");

          console.log("TIME & TEL Service Worker ready:", registration.scope);
        } catch (error) {
          console.error("Service Worker error:", error);
        }
      });
    }

    // INSTALL APP

    let deferredPrompt = null;

    const installBtn = document.getElementById("install-btn");

    function isInstalled() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;

      if (!isInstalled()) {
        installBtn.style.display = "block";
      }
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        installBtn.style.display = "none";
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      deferredPrompt = null;
    });

    if (isInstalled()) {
      installBtn.style.display = "none";
    }

    // SHARE APP

    const shareBtn = document.getElementById("share-btn");

    shareBtn.addEventListener("click", async () => {
      const shareData = {
        title: "TIME & TEL Game",
        text: "🚚⛽ Play TIME & TEL Game!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          console.log("Sharing cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(
            shareData.text + " " + shareData.url
          );
          alert("Game link copied!");
        } catch (error) {
          prompt("Copy your game link:", shareData.url);
        }
      }
    });
  </script>

</body>
</html>
