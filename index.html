<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Landscape Fullscreen PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff5722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #000;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .landscape-btn {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      width: 240px;
    }

    #install-btn {
      display: block;
      padding: 15px 30px;
      font-size: 18px;
      background-color: #2e7d32;
      color: white;
      border: 2px solid #4caf50;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      width: 240px;
    }

    #main-frame {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      outline: none;
    }

    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      z-index: 10000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (orientation: portrait) {
      body.in-landscape-mode #rotate-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <h2>📱 Please Rotate Your Phone</h2>
    <p style="margin-top: 10px; color: #aaa;">Behtar experience ke liye apna phone horizontal (landscape) ghumayein.</p>
  </div>

  <div id="start-overlay">
    <h2>Welcome to My App</h2>
    <button class="landscape-btn" onclick="launchLandscapeFullscreen()">Start in Landscape</button>
    <button id="install-btn" onclick="installPWA()">📲 Install App</button>
  </div>

  <!-- Yahan aapka app.html khulega -->
  <iframe id="main-frame" frameborder="0"></iframe>
<script src="sw.js"></script>
  <script>
    // 1. Service Worker Register
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // 2. Install Popup Logic
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        alert("App install karne ke liye:\n\n• Android Chrome: Upar 3 dots (⋮) par click karein aur 'Install app' ya 'Add to Home screen' chunein.\n\n• iPhone Safari: Neeche Share button (⬆️) dabayein aur 'Add to Home Screen' chunein.");
      }
    }

    // Agar app pehle se install hokar khula hai toh Install button chhupa dein
    if (window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches) {
      installBtn.style.display = 'none';
    }

    // 3. Landscape Fullscreen Logic
    function launchLandscapeFullscreen() {
      const elem = document.documentElement;
      const overlay = document.getElementById('start-overlay');
      const frame = document.getElementById('main-frame');

      history.pushState({ page: "landscape" }, "", "#landscape");
      document.body.classList.add('in-landscape-mode');

      overlay.style.display = 'none';
      frame.src = "app.html"; 
      frame.style.display = 'block';

      if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => lockLandscape()).catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
        lockLandscape();
      }
    }

    function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
    }

    function showWelcomeScreen() {
      const overlay = document.getElementById('start-overlay');
      const frame = document.getElementById('main-frame');

      document.body.classList.remove('in-landscape-mode');
      overlay.style.display = 'flex';
      frame.style.display = 'none';
      frame.src = "about:blank";

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("popstate", showWelcomeScreen);
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) showWelcomeScreen();
    });
  </script>

</body>
</html>
