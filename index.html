
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>TIME & TEL</title>

  <meta name="theme-color" content="#1E293B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TIME & TEL">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #1E293B;
      text-align: center;
      padding: 20px 10px 40px;
    }

    .logo {
      font-size: 65px;
      margin-top: 15px;
      margin-bottom: 12px;
    }

    h1 {
      color: #fbbf24;
      font-size: 38px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      display: block;
      width: 240px;
      max-width: 90%;
      padding: 14px;
      margin: 12px auto 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    #start-btn {
      background: #fbbf24;
      color: #111827;
    }

    #install-btn {
      display: none;
      background: #16a34a;
      color: white;
    }

    .secondary {
      background: #374151;
      color: white;
      border: 1px solid #6b7280;
    }
  </style>
</head>

<body>

  <div class="logo">🚚⛽</div>

  <h1>TIME & TEL</h1>

  <p class="subtitle">
    Welcome to Time & Tel Game!<br>
    Ready to Play?
  </p>

  <a href="./app.html" style="text-decoration:none; display:block;">
    <button id="start-btn" type="button">
      ▶ Play Now
    </button>
  </a>

  <button id="share-btn" class="secondary" type="button">
    📤 Share App
  </button>

  <button id="install-btn" type="button">
    📲 Install App
  </button>

  <script>

    // SERVICE WORKER

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => {
            console.log("Service Worker registered:", reg.scope);
          })
          .catch(err => {
            console.error("Service Worker registration failed:", err);
          });
      });
    }


    // INSTALL APP

    let deferredPrompt = null;

    const installBtn = document.getElementById("install-btn");

    function isRunningAsInstalledPWA() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.navigator.standalone === true ||
        document.referrer.includes("android-app://")
      );
    }

    async function hasRelatedInstalledApp() {
      if ("getInstalledRelatedApps" in navigator) {
        try {
          const apps = await navigator.getInstalledRelatedApps();
          return Array.isArray(apps) && apps.length > 0;
        } catch (err) {
          return false;
        }
      }
      return false;
    }

    async function updateInstallButtonVisibility() {
      if (isRunningAsInstalledPWA() || await hasRelatedInstalledApp()) {
        installBtn.style.display = "none";
        return;
      }

      installBtn.style.display = deferredPrompt ? "block" : "none";
    }

    updateInstallButtonVisibility();

    window.addEventListener("beforeinstallprompt", async (event) => {
      event.preventDefault();
      deferredPrompt = event;
      await updateInstallButtonVisibility();
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        installBtn.style.display = "none";
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      deferredPrompt = null;
    });


    // SHARE APP

    const shareBtn = document.getElementById("share-btn");

    shareBtn.addEventListener("click", async () => {

      const shareData = {
        title: "TIME & TEL Game",
        text: "🚚⛽ Play TIME & TEL Game! Try this amazing game!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          console.log("Sharing cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(
            shareData.text + " " + shareData.url
          );
          alert("Game link copied! Share it with your friends.");
        } catch (error) {
          prompt("Copy your game link:", shareData.url);
        }
      }

    });

  </script>

</body>
</html>
