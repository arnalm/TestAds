
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>TIME & TEL</title>

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TIME & TEL">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #374151, #111827 70%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
    }

    .logo {
      font-size: 65px;
      margin-bottom: 12px;
    }

    h1 {
      color: #fbbf24;
      font-size: 38px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      width: 240px;
      max-width: 90%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    #start-btn {
      background: #fbbf24;
      color: #111827;
    }

    #install-btn {
      background: #16a34a;
      color: white;
      display: none;
    }

    .secondary {
      background: #374151;
      color: white;
      border: 1px solid #6b7280;
    }
  </style>
</head>

<body>

  <div id="start-overlay">

    <div class="logo">🚚⛽</div>

    <h1>TIME & TEL</h1>

    <p class="subtitle">
      Welcome to Time & Tel Game!<br>
      Ready to Play?
    </p>

    <a href="./app.html"
      style="text-decoration:none; width:240px; max-width:90%;">

      <button id="start-btn" type="button">
        ▶ Play Now
      </button>

    </a>

    <button id="install-btn" type="button">
      📲 Install App
    </button>

    <button class="secondary" id="share-btn" type="button">
      📤 Share App
    </button>

  </div>

  <script>
    // =========================
    // PWA INSTALL BUTTON
    // =========================

    const installBtn = document.getElementById("install-btn");

    let deferredPrompt = null;

    function isInstalledPWA() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.navigator.standalone === true
      );
    }

    function updateInstallButton() {
      if (isInstalledPWA()) {
        installBtn.style.display = "none";
      } else if (deferredPrompt) {
        installBtn.style.display = "block";
      } else {
        installBtn.style.display = "none";
      }
    }

    // Check on page load and reload
    updateInstallButton();

    // Browser says installation is available
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();

      deferredPrompt = event;

      updateInstallButton();
    });

    // Install button click
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      deferredPrompt = null;

      updateInstallButton();

      if (result.outcome === "accepted") {
        installBtn.style.display = "none";
      }
    });

    // App installed
    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // Display mode changes
    const displayMode = window.matchMedia("(display-mode: standalone)");

    displayMode.addEventListener("change", updateInstallButton);


    // =========================
    // SHARE APP BUTTON
    // =========================

    const shareBtn = document.getElementById("share-btn");

    shareBtn.addEventListener("click", async () => {

      const shareData = {
        title: "TIME & TEL Game",
        text: "🚚⛽ Play TIME & TEL Game! Try this amazing game!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          console.log("Sharing cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(
            shareData.text + " " + shareData.url
          );

          alert("Game link copied! Share it with your friends.");
        } catch (error) {
          prompt("Copy your game link:", shareData.url);
        }
      }

    });

  </script>

</body>
</html>
